<div style="max-width: 600px; margin: 2rem auto;">
  <p style="margin-bottom: 2rem; opacity: 0.7;">Got feedback on a post? Want to reach out? Drop me a message here and I will do my best to get back to you very soon.</p>
  <form action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="fa2be030-991d-4b2c-a7ee-655e3e9e027c">
    <input type="hidden" name="subject" value="New message from shtlrs.com">
    <input type="hidden" name="redirect" value="{{ .Site.BaseURL }}contact/thanks">

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; margin-bottom: 0.4rem; font-size: 0.9rem; opacity: 0.7;">Name</label>
      <input
        type="text"
        name="name"
        required
        style="width: 100%; padding: 0.6rem 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box;"
      >
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; margin-bottom: 0.4rem; font-size: 0.9rem; opacity: 0.7;">Email</label>
      <input
        type="email"
        name="email"
        required
        style="width: 100%; padding: 0.6rem 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box;"
      >
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; margin-bottom: 0.4rem; font-size: 0.9rem; opacity: 0.7;">Message</label>
      <textarea
        name="message"
        required
        rows="6"
        style="width: 100%; padding: 0.6rem 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box; resize: vertical;"
      ></textarea>
    </div>

    <button
      type="submit"
      style="padding: 0.6rem 2rem; background: #c33; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;"
      onmouseover="this.style.background='#a22'"
      onmouseout="this.style.background='#c33'"
    >Send</button>
  </form>
</div>
