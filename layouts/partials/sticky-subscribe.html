{{ if .Site.Params.kitFormUrl }}
<div id="sticky-subscribe" style="
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #1a1a1a;
  color: #fff;
  padding: 0.875rem 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  z-index: 1000;
  flex-wrap: wrap;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.25);
">
  <span style="font-size: 0.95rem; font-weight: 500;">Get new posts in your inbox</span>
  <form action="{{ .Site.Params.kitFormUrl }}" method="post" target="_blank" style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
    <input
      type="email"
      name="email_address"
      placeholder="your@email.com"
      required
      style="padding: 0.4rem 0.75rem; border: none; border-radius: 4px; font-size: 0.875rem; min-width: 200px; color: #111;"
    />
    <button
      type="submit"
      style="padding: 0.4rem 1rem; background: #c33; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem; font-weight: 500;"
      onmouseover="this.style.background='#a22'"
      onmouseout="this.style.background='#c33'"
    >Subscribe</button>
  </form>
  <button
    onclick="dismissSticky()"
    aria-label="Dismiss"
    style="background: none; border: none; color: #aaa; font-size: 1.4rem; cursor: pointer; padding: 0; line-height: 1; position: absolute; right: 1rem;"
  >×</button>
</div>

<script>
  function dismissSticky() {
    document.getElementById('sticky-subscribe').style.display = 'none';
  }

  function showSubscribe(e) {
    var inline = document.getElementById('subscribe');
    if (inline) {
      e.preventDefault();
      inline.scrollIntoView({ behavior: 'smooth' });
    } else {
      e.preventDefault();
      var bar = document.getElementById('sticky-subscribe');
      bar.style.display = 'flex';
      bar.querySelector('input[type="email"]').focus();
    }
  }
</script>
{{ end }}
