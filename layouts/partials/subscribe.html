{{ if .Site.Params.kitFormUrl }}
<div id="subscribe" style="
  margin-top: 3rem;
  padding: 2rem;
  border-top: 1px solid #e0e0e0;
  text-align: center;
">
  <h3 style="margin-bottom: 0.5rem;">Subscribe</h3>
  <p style="margin-bottom: 1rem; opacity: 0.7; font-size: 0.9rem;">Get an email when new posts drop.</p>
  <form action="{{ .Site.Params.kitFormUrl }}" method="post" target="_blank" style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
    <input
      type="email"
      name="email_address"
      placeholder="your@email.com"
      required
      style="padding: 0.5rem 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; min-width: 240px;"
    />
    <button
      type="submit"
      style="padding: 0.5rem 1.5rem; background: #c33; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem;"
      onmouseover="this.style.background='#a22'"
      onmouseout="this.style.background='#c33'"
    >Subscribe</button>
  </form>
</div>
{{ end }}
